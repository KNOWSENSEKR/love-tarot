<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연애운 타로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #1a0f2e, #2a1b4a, #3a1f4f);
        }
        .tarot-card {
            height: 340px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65);
            position: relative;
            transition: transform 0.4s ease;
        }
        .tarot-card:hover {
            transform: scale(1.04);
        }
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            padding: 28px 16px 20px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <h1 class="text-5xl font-bold text-white mb-3 tracking-tight">연애운 타로</h1>
        <p class="text-purple-300 text-lg mb-14">3장으로 보는 당신의 연애 이야기</p>

        <div class="grid grid-cols-3 gap-6 mb-14" id="cards">
            <div id="card1" class="tarot-card"></div>
            <div id="card2" class="tarot-card"></div>
            <div id="card3" class="tarot-card"></div>
        </div>

        <button onclick="drawCards()" 
                class="px-20 py-7 text-xl font-medium rounded-3xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white shadow-2xl transition-all active:scale-95">
            새로운 타로 3장 펼치기
        </button>

        <div id="result" class="hidden mt-16 bg-white/10 backdrop-blur-2xl rounded-3xl p-12 text-left border border-white/10">
            <h3 class="text-2xl font-bold text-white mb-10 text-center">당신의 연애운 해석</h3>
            <div id="interpretation" class="text-purple-100 leading-relaxed text-[17.3px] space-y-8"></div>
        </div>
    </div>

    <script>
        // 클로드가 만든 정확한 주소: https://knowsensekr.github.io/love/1.png ~ 22.png
        const baseUrl = "https://knowsensekr.github.io/love/";

        const deck = Array.from({ length: 22 }, (_, i) => ({
            name: `타로 카드 ${i+1}`,
            desc: "연애운",
            img: `${baseUrl}${i+1}.png`
        }));

        let currentIndex = 0;

        const finalMessages = [
            "당신은 혼자여도 충분히 빛나는 사람입니다. 진짜 사랑은 당신을 더 자유롭고 당당하게 만들어줄 거예요.",
            "자신을 사랑하는 마음이 강해질수록 좋은 인연이 다가올 거예요.",
            "과거의 상처를 잘 치유하고 있다면, 이제 더 건강한 사랑이 찾아올 때입니다.",
            "당신의 마음이 자유로워지면 진짜 사랑이 자연스럽게 들어올 거예요.",
            "혼자 있는 시간이 소중해요. 그 시간이 당신을 더 아름답게 만들어줄 거예요.",
            "당신은 사랑받을 자격이 충분한 사람입니다. 자신을 믿고 기다려보세요.",
            "진짜 사랑은 당신을 더 강하고 행복하게 만들어줄 거예요.",
            "현재 당신의 에너지는 매우 밝아요. 좋은 변화가 곧 찾아올 겁니다.",
            "당신은 이미 충분히 매력적인 사람이에요. 자신감을 가져도 좋아요.",
            "건강한 연애는 자신을 사랑하는 마음에서 시작됩니다.",
            "미래에는 서로를 존중하고 응원하는 따뜻한 관계가 기다리고 있어요.",
            "당신의 행복은 결국 당신 스스로가 선택하는 거예요.",
            "과거의 교훈을 잘 새기면, 이번에는 더 나은 사랑을 만날 수 있을 거예요.",
            "당신은 강하고 아름다운 사람입니다.",
            "진짜 사랑은 당신을 자유롭게 만들어줄 거예요.",
            "자신을 먼저 돌보는 시간이 필요해요.",
            "당신은 사랑을 받을 뿐만 아니라, 사랑을 줄 수 있는 멋진 사람이에요.",
            "이번에는 과거의 패턴을 반복하지 않고 새로운 사랑을 시작할 수 있을 거예요.",
            "당신의 마음이 안정되면 정말 좋은 사람이 다가올 가능성이 커요.",
            "혼자여도 빛나는 당신이니까, 서두르지 않아도 괜찮아요.",
            "건강하고 균형 잡힌 사랑이 곧 당신에게 찾아올 거예요.",
            "당신은 이미 준비가 되어 있는 사람입니다.",
            "진짜 사랑은 당신을 더 당당하고 행복하게 만들어줄 것입니다.",
            "자신을 사랑하는 마음이 가장 중요한 열쇠예요.",
            "미래에는 서로를 성장시켜주는 따뜻한 관계가 펼쳐질 거예요.",
            "당신은 충분히 사랑받을 가치가 있는 사람입니다.",
            "과거를 잘 정리하면 더 밝은 연애운이 열릴 거예요.",
            "당신의 행복은 당신 손에 있어요.",
            "진짜 사랑은 당신을 더 자유롭게 만들어줄 거예요.",
            "당신은 혼자여도 충분히 멋진 사람이에요. 자신을 아껴주세요."
        ];

        function drawCards() {
            document.getElementById('result').classList.add('hidden');

            const shuffled = [...deck].sort(() => Math.random() - 0.5);
            const c1 = shuffled[0];
            const c2 = shuffled[1];
            const c3 = shuffled[2];

            document.getElementById('card1').innerHTML = `<img src="${c1.img}" class="w-full h-full object-cover"><div class="card-label"><p class="font-bold text-2xl">${c1.name}</p><p class="text-sm opacity-90">${c1.desc}</p></div>`;
            document.getElementById('card2').innerHTML = `<img src="${c2.img}" class="w-full h-full object-cover"><div class="card-label"><p class="font-bold text-2xl">${c2.name}</p><p class="text-sm opacity-90">${c2.desc}</p></div>`;
            document.getElementById('card3').innerHTML = `<img src="${c3.img}" class="w-full h-full object-cover"><div class="card-label"><p class="font-bold text-2xl">${c3.name}</p><p class="text-sm opacity-90">${c3.desc}</p></div>`;

            const message = finalMessages[currentIndex];
            currentIndex = (currentIndex + 1) % finalMessages.length;

            document.getElementById('interpretation').innerHTML = `
                <p><strong>과거:</strong> ${c1.desc}의 경험이 아직 당신의 마음에 영향을 주고 있습니다.</p>
                <p class="mt-7"><strong>현재:</strong> ${c2.desc}의 에너지가 강하게 느껴지는 시기예요. 자신을 먼저 사랑해주세요.</p>
                <p class="mt-7"><strong>미래:</strong> ${c3.desc}의 방향으로 흘러갈 가능성이 높습니다. 건강한 사랑을 기대해도 좋아요.</p>
                <p class="mt-12 pt-8 border-t border-purple-700/50 text-purple-200 text-center font-medium">${message}</p>
            `;

            document.getElementById('result').classList.remove('hidden');
        }

        window.onload = drawCards;
    </script>
</body>
</html>
