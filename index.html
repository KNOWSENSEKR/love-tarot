<script>
        // 타로 카드 이름 (이 부분은 가벼우므로 유지)
        const _0x1a2c=["바보","마법사","여교황","여황제","황제","교황","연인","전차","힘","은둔자","운명의 수레바퀴","정의","매달린 사람","죽음","절제","악마","탑","별","달","태양","심판","세계"];
        
        // 외부 데이타를 담을 빈 저장소
        let tarotData = null;

        // 페이지가 열릴 때 data.json 파일을 비동기(Fetch API)로 불러옵니다.
        window.onload = async () => {
            const _0xcon = document.getElementById('cards');
            for(let i=0;i<3;i++) _0xcon.innerHTML+=`<div class="card"><div class="card-inner"><div class="card-back"></div></div></div>`;

            try {
                // data.json 가져오기
                const response = await fetch('data.json');
                tarotData = await response.json();
                console.log("텍스트 데이타 로드 완료");
            } catch (error) {
                console.error("데이터 로드 에러:", error);
                alert("텍스트 데이타를 불러오지 못했습니다. 파일 경로를 확인해주세요.");
            }
        };

        // 핵심 실행 함수
        function _0x8c4b(){
            // 데이터가 아직 불러와지지 않았을 때의 예외 처리
            if (!tarotData) {
                alert("데이터를 준비 중입니다. 잠시 후 다시 버튼을 눌러주세요.");
                return;
            }

            const _0xd1=document.getElementById('cards');
            const _0xd2=document.getElementById('interpretation');
            const _0xd3=document.getElementById('draw-btn');
            
            _0xd3.innerText='카드 다시 뽑기';

            let _0xarr=Array.from({length:22},(_,i)=>i+1);
            for(let i=_0xarr.length-1;i>0;i--){
                const j=Math.floor(Math.random()*(i+1));
                [_0xarr[i],_0xarr[j]]=[_0xarr[j],_0xarr[i]];
            }
            const _0xsel=_0xarr.slice(0,3);

            // 불러온 외부 JSON 데이터(tarotData)에서 랜덤 추출
            const _0xsp=[
                tarotData.past[Math.floor(Math.random()*tarotData.past.length)],
                tarotData.present[Math.floor(Math.random()*tarotData.present.length)],
                tarotData.future[Math.floor(Math.random()*tarotData.future.length)]
            ];

            _0xd1.innerHTML='';
            _0xd2.innerHTML='';
            _0xd2.style.display='block';

            const _0xtit=['[과거] 연애 흐름','[현재] 상대방 속마음','[미래] 관계 변화'];

            _0xsel.forEach((n,i)=>{
                const nm=_0x1a2c[n-1];
                _0xd1.innerHTML+=`<div class="card" id="cr_${i}"><div class="card-inner"><div class="card-back"></div><div class="card-front"><img src="${n}.png" alt="${nm}" onerror="this.src='https://via.placeholder.com/150x225/1a0033/ffccff?text=${nm}'"><div class="card-name">${nm}</div></div></div></div>`;
                setTimeout(()=>document.getElementById(`cr_${i}`).classList.add('flipped'),150+i*150);
            });

            let _0xhtm=`<h2 style="font-size:1.3rem;color:#00FFCC;text-align:center;margin-bottom:15px;">🔮 카드 분석 결과</h2>`;
            for(let i=0;i<3;i++){
                _0xhtm+=`<div class="position">${_0xtit[i]}</div><div class="message">${_0xsp[i]}</div>`;
            }

            // 불러온 데이터에서 총운 데이타 랜덤 추출
            const _0xsum=tarotData.total[Math.floor(Math.random()*tarotData.total.length)]; 
            
            _0xhtm+=`<div class="total-fortune"><div class="total-title">🌟 마음코드 종합 솔루션</div><div class="message" style="text-align:center;font-weight:bold;color:#fff;">${_0xsum}</div><a href="https://youtu.be/VsDF_ptjM4E" target="_blank" class="final-cta">주도권 되찾는 구체적 전략 보기 ▶</a></div>`;
            _0xd2.innerHTML=_0xhtm;

            setTimeout(()=>_0xd2.scrollIntoView({behavior:'smooth'}),800);
        }
    </script>
