<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음코드 연애심리 타로 v1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #2a0044, #4a0077); 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
        }
        h1 { 
            font-size: 2.8rem; 
            color: #ffccff; 
            margin: 25px 0 10px; 
            text-shadow: 0 0 20px rgba(255,100,255,0.8); 
        }
        .sub-btn { 
            display: inline-block; 
            background: #ff3399; 
            color: white; 
            padding: 14px 34px; 
            font-size: 1.15rem; 
            border-radius: 50px; 
            text-decoration: none; 
            margin: 10px 0 25px; 
            box-shadow: 0 8px 20px rgba(255,51,153,0.4); 
        }
        .sub-btn:hover { background: #ff66bb; transform: scale(1.05); }
        
        .description { 
            font-size: 1.35rem; 
            margin: 15px 0 40px; 
            color: #ffddff; 
        }
        
        button { 
            background: linear-gradient(45deg, #ff3399, #ff66cc); 
            color: white; 
            border: none; 
            padding: 16px 42px; 
            font-size: 1.35rem; 
            font-weight: 700; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(255,51,153,0.5); 
            transition: all 0.3s; 
        }
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(255,51,153,0.6); 
        }

        .cards { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            margin: 45px 0; 
            flex-wrap: wrap; 
        }
        .card { 
            width: 200px; 
            height: 290px; 
            perspective: 1200px; 
        }
        .card-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.9s cubic-bezier(0.25,0.1,0.25,1); 
            transform-style: preserve-3d; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
        }
        .card.flipped .card-inner { 
            transform: rotateY(180deg); 
        }
        .card-front, .card-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 16px; 
            overflow: hidden; 
        }
        .card-back { 
            background: url('back.png') center/cover no-repeat; 
        }
        .card-front { 
            background: #1a0033; 
            color: #fff; 
            transform: rotateY(180deg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 12px; 
        }
        .card-front img { 
            width: 100%; 
            height: 205px; 
            object-fit: cover; 
            border-radius: 16px 16px 0 0; 
        }
        .card-name { 
            font-size: 24px;        /* ← 크기 줄임 */
            font-weight: 900; 
            color: #ffccff; 
            margin: 12px 0 0; 
            text-shadow: 0 2px 6px rgba(255,100,255,0.7); 
            line-height: 1.2; 
            padding: 0 8px; 
        }

        .interpretation { 
            max-width: 820px; 
            margin: 50px auto 0; 
            background: rgba(255,255,255,0.08); 
            border-radius: 20px; 
            padding: 35px 25px; 
        }
        .position { 
            font-size: 1.6rem; 
            color: #ffccff; 
            margin: 28px 0 10px; 
            font-weight: 700; 
        }
        .message { 
            font-size: 1.18rem; 
            line-height: 1.8; 
            color: #ffeeee; 
            padding: 0 12px; 
        }
    </style>
</head>
<body>
    <h1>🔮 마음코드 연애심리 타로 v1.0</h1>
    <a href="https://www.youtube.com/@mindcode_k" target="_blank" class="sub-btn">▶️ 마음코드 구독하기</a>
    <div class="description">당신의 사랑 이야기를 카드가 말합니다</div>

    <button onclick="drawCards()">새로운 타로 3장 펼치기</button>

    <div class="cards" id="cards"></div>
    <div class="interpretation" id="interpretation"></div>

    <script>
        const cardNames = ["바보","마법사","여교황","여황제","황제","교황","연인","전차","힘","은둔자","운명의 수레바퀴","정의","매달린 사람","죽음","절제","악마","탑","별","달","태양","심판","세계"];
        
        const loveMessages = [

            "현재 관계는 작은 변화만으로도 충분히 회복될 수 있는 단계예요. 연락을 멈추고 자신을 가꾸며 희소성 원리를 자연스럽게 적용해보세요.",
            "상대는 당신과의 좋은 추억을 자주 떠올리며 후회하고 있습니다. 하지만 자존심 때문에 솔직한 마음을 표현하지 못하고 있어요.",
            "지금은 연락을 줄이고 자신만의 시간을 갖는 것이 중요합니다. 당신이 더 빛나고 당당해질수록 상대가 다시 끌리게 될 거예요.",
            "희소성 원리를 활용하면 상대가 자연스럽게 불안해하며 당신에게 먼저 다가올 가능성이 높아집니다.",
            "상대방 마음속에 당신이 여전히 큰 자리를 차지하고 있어요. 조금만 더 기다리면 상대가 먼저 움직일 신호가 올 수 있습니다.",
            "이 카드는 당신이 연애 주도권을 되찾기 위해 자신감을 키워야 할 때임을 알려주고 있습니다.",
            "현재는 관계를 강요하지 말고, 천천히 당신의 매력을 어필하는 시기예요. 상대가 당신의 가치를 다시 느끼게 될 거예요.",
            "상대는 당신을 그리워하지만, ‘잘해줬는데 왜 차였을까’ 하는 혼란 속에 빠져 있어요. 당신이 차분하게 거리를 두면 상대가 깨닫게 됩니다.",
            "당신의 따뜻한 마음이 상대에게 다시 전달되려면, 지금은 행동보다 태도를 바꾸는 것이 더 중요합니다.",
            "현재 상대방은 당신과의 관계를 다시 생각하고 있으며, 조만간 연락이 올 가능성이 큽니다.",
            "이 카드는 당신이 조금 더 자신을 사랑하고 가꾸는 시간을 가져야 함을 보여주고 있어요.",
            "상대가 먼저 다가오게 하려면, 지금은 연락을 끊고 당신만의 행복을 찾는 것이 가장 좋은 방법입니다.",
            "관계가 어려웠던 과거를 극복하고, 새로운 시작을 할 수 있는 에너지가 들어오고 있습니다.",
            "상대는 당신을 잊지 못하고 있지만, 자존심 때문에 ‘먼저 연락하면 지는 것’처럼 느끼고 있어요.",
            "지금 당신의 태도가 관계의 미래를 결정합니다. 차분하고 여유로운 모습을 보여주세요.",
            "희소성 원리와 간헐적 강화를 적절히 사용하면 상대가 당신에게 더 큰 관심을 보일 거예요.",

            "현재는 기다림의 시간입니다. 서두르지 말고 자연스러운 흐름을 믿어보세요.",
            "당신이 더 강하고 매력적인 사람이 될수록 상대는 자연스럽게 돌아오게 됩니다.",
            "이 카드는 ‘잘해줬는데 왜 차였을까’에 대한 답을 주고 있어요. 이제 주도권을 당신이 가져갈 차례입니다.",
            "상대는 현재 혼란스러워하고 있지만, 당신의 진심을 느끼면 다시 마음이 열릴 수 있습니다.",
            "연락을 멈추고 자신을 먼저 돌보는 것이 상대를 다시 끌어당기는 가장 빠른 길입니다.",
            "당신의 가치가 높아질수록 상대가 후회하게 되는 순간이 올 거예요.",
            "현재 관계는 재정비의 시간이 필요합니다. 강요보다는 자연스러운 만남을 기다려보세요.",
            "상대방은 당신을 생각할 때마다 미안함과 그리움을 동시에 느끼고 있습니다.",
            "이 카드는 당신이 더 이상 기다리지 말고, 자신의 삶을 즐기는 모습을 보여주라고 말하고 있어요.",
            "조금만 더 인내하면 상대가 먼저 연락이 올 확률이 매우 높아집니다.",
            "당신의 매력이 상대에게 다시 느껴지도록, 외적인 모습도 조금 신경 써보세요.",
            "과거의 아픔을 내려놓고 새로운 마음으로 다가가면 좋은 결과가 있을 거예요.",
            "상대는 당신과의 관계를 포기하지 않았지만, 어떻게 다가와야 할지 모르고 있어요.",
            "지금은 당신이 중심이 되어 관계를 이끌어가는 연습을 할 때입니다.",
            "희소성 원리를 잘 활용하면 상대가 불안해하며 당신을 찾게 될 거예요.",
            "당신이 행복해지는 모습이 상대에게 가장 큰 매력이 될 수 있습니다.",
            "현재는 관계를 분석하기보다는, 자신을 사랑하는 데 집중하세요.",
            "상대방의 마음이 다시 움직이려면, 당신이 먼저 여유를 보여주는 것이 중요합니다.",
            "이 카드는 곧 좋은 소식이 올 것을 예고하고 있어요. 조금만 더 기다려보세요.",
            "과거의 패턴을 반복하지 말고, 새로운 태도로 접근하면 관계가 달라질 거예요.",
            "상대는 당신을 잊으려 애쓰지만, 잘 되지 않고 있어요.",
            "당신이 더 강해질수록 상대가 약해지는 역전 현상이 일어납니다.",
            "지금은 연락 대신, 당신만의 매력을 키우는 데 투자하세요.",
            "상대방은 당신과의 미래를 상상하며 갈등하고 있습니다.",
            "이 카드는 관계 회복의 열쇠가 당신에게 있음을 보여주고 있어요.",
            "천천히, 그러나 확실하게 주도권을 가져오는 것이 지금 필요한 전략입니다.",
            "상대가 다시 다가오게 하려면, 당신이 먼저 행복한 모습을 보여주세요.",
            "현재 어려움은 곧 지나갈 것이며, 더 단단한 관계로 이어질 수 있습니다.",
            "당신의 진심이 상대에게 전달되려면, 지금은 침묵이 더 효과적입니다.",
            "이 카드는 당신이 더 이상 피해자가 아닌 주인공이 되어야 할 때임을 알려줍니다.",
            "상대는 당신을 그리워하면서도 자존심 때문에 참고 있어요. 당신이 먼저 움직이지 마세요.",
            "관계가 다시 피어나려면, 당신의 에너지를 자신에게 돌리는 것이 가장 좋습니다.",
            "곧 상대가 당신의 가치를 다시 깨닫고 연락이 올 가능성이 큽니다.",
            "당신이 빛나는 모습을 보면 상대는 자연스럽게 돌아오게 되어 있어요."
        ];

        function getRandomCard() {
            return Math.floor(Math.random() * 22) + 1;
        }

        function drawCards() {
            const container = document.getElementById('cards');
            const interpDiv = document.getElementById('interpretation');
            
            container.innerHTML = '';
            interpDiv.innerHTML = '';

            const positions = ['과거', '현재', '미래'];

            for (let i = 0; i < 3; i++) {
                const num = getRandomCard();
                const name = cardNames[num - 1];

                const cardHTML = `
                    <div class="card" id="card${i}">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front">
                                <img src="${num}.png" alt="${name}">
                                <div class="card-name">${name}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;

                setTimeout(() => {
                    document.getElementById(`card${i}`).classList.add('flipped');
                }, 150 + i * 150);
            }

            // 긴 해석 강제 출력
            let html = `<h2 style="color:#ffccff; margin-bottom:35px;">당신의 연애운 해석</h2>`;
            for (let i = 0; i < 3; i++) {
                const randomMsg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                html += `
                    <div class="position">${positions[i]}</div>
                    <div class="message">${randomMsg}</div>
                `;
            }
            interpDiv.innerHTML = html;
        }

        window.onload = () => {
            const container = document.getElementById('cards');
            let html = '';
            for (let i = 0; i < 3; i++) {
                html += `<div class="card"><div class="card-inner"><div class="card-back"></div><div class="card-front"></div></div></div>`;
            }
            container.innerHTML = html;
        };
    </script>
</body>
</html>
