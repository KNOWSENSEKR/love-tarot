        function drawCards() {
            const container = document.getElementById('cards');
            const interpDiv = document.getElementById('interpretation');
            const drawBtn = document.getElementById('draw-btn');
            
            // 버튼 텍스트 변경
            drawBtn.innerText = '카드 다시 뽑기';

            // 1. 타로 카드 번호 무작위 3장 뽑기
            let cardIndices = Array.from({length: 22}, (_, i) => i + 1);
            for (let i = cardIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardIndices[i], cardIndices[j]] = [cardIndices[j], cardIndices[i]];
            }
            const selectedCards = cardIndices.slice(0, 3);

            // 2. 과거/현재/미래 개별 해석 무작위 3개 뽑기 (중복 방지)
            let shuffledLoveMessages = [...loveMessages].sort(() => 0.5 - Math.random());
            const selectedIndividualMessages = shuffledLoveMessages.slice(0, 3);

            container.innerHTML = '';
            interpDiv.innerHTML = '';
            interpDiv.style.display = 'block';

            const positions = ['[과거] 연애 흐름', '[현재] 상대방 속마음', '[미래] 관계 변화'];
            let drawnMessages = [];

            // 카드 렌더링 및 개별 해석 할당
            selectedCards.forEach((num, i) => {
                const name = cardNames[num - 1];
                const msg = selectedIndividualMessages[i];
                drawnMessages.push(msg);

                container.innerHTML += `
                    <div class="card" id="card${i}">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front">
                                <img src="${num}.png" alt="${name}" onerror="this.src='https://via.placeholder.com/150x225/1a0033/ffccff?text=${name}'">
                                <div class="card-name">${name}</div>
                            </div>
                        </div>
                    </div>`;
                setTimeout(() => document.getElementById(`card${i}`).classList.add('flipped'), 150 + i * 150);
            });

            // 개별 해석 영역 HTML 생성
            let html = `<h2 style="font-size:1.3rem; color:#00FFCC; text-align:center; margin-bottom:15px;">🔮 카드 분석 결과</h2>`;
            for (let i = 0; i < 3; i++) {
                html += `<div class="position">${positions[i]}</div><div class="message">${drawnMessages[i]}</div>`;
            }

            // 3. 52개 종합 솔루션 풀에서 1개 무작위 뽑기
            const summary = totalSummaries[Math.floor(Math.random() * totalSummaries.length)]; 
            
            html += `
                <div class="total-fortune">
                    <div class="total-title">🌟 마음코드 종합 솔루션</div>
                    <div class="message" style="text-align:center; font-weight:bold; color:#fff;">${summary}</div>
                    <a href="https://youtu.be/VsDF_ptjM4E" target="_blank" class="final-cta">
                        주도권 되찾는 구체적 전략 보기 ▶
                    </a>
                </div>`;
            interpDiv.innerHTML = html;

            // 결과 화면으로 부드럽게 스크롤
            setTimeout(() => interpDiv.scrollIntoView({ behavior: 'smooth' }), 800);
        }

        window.onload = () => {
            const container = document.getElementById('cards');
            for (let i = 0; i < 3; i++) container.innerHTML += `<div class="card"><div class="card-inner"><div class="card-back"></div></div></div>`;
        };
