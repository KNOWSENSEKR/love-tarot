<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연애운 타로 | 3장 스프레드 + AI 상담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .chat-bubble { max-width: 80%; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 to-pink-950 min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-2 text-purple-200">연애운 타로</h1>
        <p class="text-center text-purple-300 mb-8">3장으로 보는 당신의 연애 이야기</p>

        <!-- 타로 카드 영역 -->
        <div class="grid grid-cols-3 gap-6 mb-10" id="cards">
            <!-- 카드 들어갈 자리 -->
        </div>

        <div class="text-center mb-8">
            <button onclick="drawNewCards()" class="px-12 py-5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl font-medium text-lg shadow-lg hover:shadow-xl">
                새로운 타로 뽑기
            </button>
        </div>

        <!-- 해석 영역 -->
        <div id="result" class="hidden bg-white rounded-3xl p-9 shadow-2xl mb-8">
            <h3 class="text-2xl font-bold text-center mb-6 text-purple-800">당신의 연애운 해석</h3>
            <div id="interpretation" class="text-gray-700 leading-relaxed text-[17.2px]"></div>
            
            <button onclick="openChat()" 
                    class="mt-8 w-full py-4 bg-purple-700 hover:bg-purple-800 text-white rounded-2xl font-medium">
                ✨ AI 타로 마스터에게 더 자세히 물어보기
            </button>
        </div>

        <!-- 챗봇 모달 -->
        <div id="chatModal" class="hidden fixed inset-0 bg-black/70 flex items-end justify-center z-50">
            <div class="bg-white w-full max-w-lg rounded-t-3xl h-[85vh] flex flex-col">
                <div class="p-5 border-b flex justify-between items-center bg-purple-800 text-white rounded-t-3xl">
                    <div>
                        <p class="font-bold">타로 마스터 세라</p>
                        <p class="text-xs opacity-75">AI 연애운 상담사</p>
                    </div>
                    <button onclick="closeChat()" class="text-2xl">✕</button>
                </div>
                
                <div id="chatMessages" class="flex-1 p-5 overflow-y-auto space-y-4 bg-gray-50">
                    <!-- 메시지 들어가는 곳 -->
                </div>

                <div class="p-4 border-t flex gap-2">
                    <input id="userInput" type="text" placeholder="예: 이 사람이 나를 진심으로 좋아할까?" 
                           class="flex-1 border rounded-2xl px-5 py-3 focus:outline-none focus:border-purple-500">
                    <button onclick="sendMessage()" 
                            class="bg-purple-700 text-white px-8 rounded-2xl font-medium">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ... (타로 22장 deck과 interpretations는 이전 코드 그대로 사용)

        let currentTarotResult = "";

        function drawNewCards() {
            // 기존 타로 뽑기 로직 (22장 랜덤 3장)
            // ... 생략 (이전 코드와 동일)

            currentTarotResult = document.getElementById('interpretation').innerHTML;
        }

        function openChat() {
            document.getElementById('chatModal').classList.remove('hidden');
            addBotMessage("안녕하세요, 저는 타로 마스터 세라예요. 방금 뽑은 타로 카드에 대해 더 궁금한 점이 있으신가요?");
        }

        function closeChat() {
            document.getElementById('chatModal').classList.add('hidden');
        }

        function addBotMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `
                <div class="flex gap-3">
                    <div class="w-8 h-8 bg-purple-600 rounded-full flex-shrink-0"></div>
                    <div class="chat-bubble bg-purple-100 p-4 rounded-2xl rounded-tl-none">${text}</div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
        }

        function addUserMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `
                <div class="flex justify-end">
                    <div class="chat-bubble bg-purple-600 text-white p-4 rounded-2xl rounded-tr-none">${text}</div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addUserMessage(text);
            input.value = "";

            // 간단한 AI 응답 로직 (타로 결과와 연계)
            setTimeout(() => {
                const responses = [
                    "네, 그 부분이 제일 궁금하시군요. 방금 뽑은 카드에서 '" + currentTarotResult.substring(0, 30) + "...' 부분을 보면...",
                    "좋은 질문이에요. 타로 카드가 말해주는 건...",
                    "그 사람의 마음은 현재 '" + currentTarotResult.substring(0, 40) + "'와 연결되어 있어요.",
                    "조금 더 기다려보는 게 좋을 것 같아요. 카드가 조언하는 건..."
                ];
                const randomReply = responses[Math.floor(Math.random() * responses.length)];
                addBotMessage(randomReply);
            }, 800);
        }

        window.onload = drawNewCards;
    </script>
</body>
</html>
