<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연애운 타로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 to-pink-950 min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <h1 class="text-4xl font-bold text-white mb-2">연애운 타로</h1>
        <p class="text-purple-300 mb-12">3장으로 보는 당신의 연애 이야기</p>

        <!-- 카드 3장 -->
        <div class="grid grid-cols-3 gap-6 mb-12" id="cards">
            <div id="card1" class="bg-white/10 backdrop-blur-md rounded-3xl h-72 flex items-center justify-center text-center p-4"></div>
            <div id="card2" class="bg-white/10 backdrop-blur-md rounded-3xl h-72 flex items-center justify-center text-center p-4"></div>
            <div id="card3" class="bg-white/10 backdrop-blur-md rounded-3xl h-72 flex items-center justify-center text-center p-4"></div>
        </div>

        <button onclick="drawCards()" 
                class="px-16 py-6 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white text-xl font-medium rounded-3xl shadow-xl transition-all">
            새로운 타로 3장 펼치기
        </button>

        <!-- 해석 영역 -->
        <div id="result" class="hidden mt-16 bg-white/10 backdrop-blur-md rounded-3xl p-10">
            <h3 class="text-2xl font-bold text-white mb-8">당신의 연애운 해석</h3>
            <div id="interpretation" class="text-purple-100 text-left leading-relaxed text-[17px] space-y-6"></div>
        </div>
    </div>

    <script>
        const deck = [
            { name: "연인", desc: "강렬한 끌림과 선택" },
            { name: "여황제", desc: "풍요롭고 따뜻한 사랑" },
            { name: "여사제", desc: "내면의 지혜" },
            { name: "마법사", desc: "능동적인 사랑" },
            { name: "태양", desc: "밝은 행복" },
            { name: "별", desc: "희망과 치유" },
            { name: "탑", desc: "갑작스러운 변화" },
            { name: "달", desc: "불안과 착각" },
            { name: "죽음", desc: "관계의 전환" },
            { name: "절제", desc: "균형과 조화" }
        ];

        function drawCards() {
            document.getElementById('result').classList.add('hidden');

            const shuffled = [...deck].sort(() => Math.random() - 0.5);
            const c1 = shuffled[0];
            const c2 = shuffled[1];
            const c3 = shuffled[2];

            document.getElementById('card1').innerHTML = `<div><div class="text-6xl mb-3">🃏</div><p class="font-bold text-white">${c1.name}</p><p class="text-purple-300 text-sm">${c1.desc}</p></div>`;
            document.getElementById('card2').innerHTML = `<div><div class="text-6xl mb-3">🃏</div><p class="font-bold text-white">${c2.name}</p><p class="text-purple-300 text-sm">${c2.desc}</p></div>`;
            document.getElementById('card3').innerHTML = `<div><div class="text-6xl mb-3">🃏</div><p class="font-bold text-white">${c3.name}</p><p class="text-purple-300 text-sm">${c3.desc}</p></div>`;

            document.getElementById('interpretation').innerHTML = `
                <p><strong>과거:</strong> ${c1.desc}의 경험이 아직 영향을 주고 있습니다.</p>
                <p class="mt-6"><strong>현재:</strong> ${c2.desc}의 에너지가 강하게 느껴지는 시기예요. 자신을 먼저 돌보세요.</p>
                <p class="mt-6"><strong>미래:</strong> ${c3.desc}의 방향으로 흘러갈 가능성이 높습니다. 건강한 사랑을 기대해도 좋습니다.</p>
            `;

            document.getElementById('result').classList.remove('hidden');
        }

        // 페이지 로드 시 자동으로 한 번 펼침
        window.onload = drawCards;
    </script>
</body>
</html>
