<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연애운 타로 | 3장 스프레드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .card {
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            height: 280px;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.9s;
            transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .card-front {
            background: linear-gradient(135deg, #3b0764, #6b21a8);
            color: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .card-back {
            background: #0f172a;
            transform: rotateY(180deg);
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.1) sepia(0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 to-pink-950 min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-2 text-purple-200">연애운 타로</h1>
        <p class="text-center text-purple-300 mb-10">3장으로 보는 당신의 연애 이야기</p>

        <div class="grid grid-cols-3 gap-6" id="cards">
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">과거</div>
                    <div class="card-back" id="past"></div>
                </div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">현재</div>
                    <div class="card-back" id="present"></div>
                </div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">미래</div>
                    <div class="card-back" id="future"></div>
                </div>
            </div>
        </div>

        <div class="text-center mt-12">
            <button onclick="drawNewCards()" 
                    class="px-12 py-5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl font-medium text-lg shadow-lg hover:shadow-xl transition-all">
                새로운 타로 뽑기
            </button>
        </div>

        <div id="result" class="mt-12 hidden">
            <div class="bg-white rounded-3xl p-9 shadow-2xl">
                <h3 class="text-2xl font-bold text-center mb-8 text-purple-800">당신의 연애운 해석</h3>
                <div id="interpretation" class="text-gray-700 leading-relaxed text-[17.2px] space-y-6"></div>
            </div>
        </div>
    </div>

    <script>
        // 3개의 서로 다른 타로 카드 이미지 (중복 방지)
        const tarotCards = [
            { name: "연인",   desc: "강렬한 끌림과 선택의 순간", img: "https://picsum.photos/id/1015/300/420" },
            { name: "여황제", desc: "풍요롭고 따뜻한 사랑 에너지", img: "https://picsum.photos/id/1027/300/420" },
            { name: "여사제", desc: "내면의 지혜와 직관", img: "https://picsum.photos/id/1012/300/420" }
        ];

        // 30개의 다양한 해석 문구
        const interpretations = [
            "과거의 경험은 당신을 더 강하게 만들었어요. 이제는 자신을 우선으로 하는 사랑을 만나게 될 거예요.",
            "현재 당신은 누군가에게 의지하기보다는 스스로를 사랑하는 법을 배우고 있어요. 이 과정이 매우 소중합니다.",
            "미래에는 건강하고 존중받는 관계가 기다리고 있어요. 당신의 행복은 당신 스스로가 선택하는 거예요.",
            "당신은 이미 충분히 빛나는 사람이에요. 진짜 사랑은 당신을 더 자유롭게 만들어줄 거예요.",
            "과거의 아픔이 지금의 당신을 더 현명하게 만들었어요. 이제는 자신을 아끼는 선택을 할 때입니다.",
            "현재는 자신을 돌아보는 시간이 필요해요. 당신의 마음을 먼저 채우면 좋은 인연이 자연스럽게 다가올 거예요.",
            "미래에는 균형 잡힌, 서로를 존중하는 사랑이 찾아올 가능성이 높아요. 기대해도 좋아요.",
            "당신은 혼자여도 충분히 행복할 수 있는 사람입니다. 그 마음이 진짜 사랑을 끌어당길 거예요.",
            "과거의 교훈을 잘 새기고 있다면, 이번에는 훨씬 더 건강한 관계를 만들 수 있을 거예요.",
            "현재 당신의 에너지는 매우 밝아요. 자신을 사랑하는 마음이 강해질수록 좋은 일이 생길 거예요."
        ];

        let currentIndex = 0;

        function drawNewCards() {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));

            // 3개의 카드를 순차적으로 회전
            const card1 = tarotCards[0];
            const card2 = tarotCards[1];
            const card3 = tarotCards[2];

            document.getElementById('past').innerHTML = `<img src="${card1.img}" class="card-img rounded-t-2xl" alt="${card1.name}"><p class="text-xl font-bold text-purple-200 mt-3">${card1.name}</p><p class="mt-2 text-purple-300 text-sm">${card1.desc}</p>`;
            document.getElementById('present').innerHTML = `<img src="${card2.img}" class="card-img rounded-t-2xl" alt="${card2.name}"><p class="text-xl font-bold text-purple-200 mt-3">${card2.name}</p><p class="mt-2 text-purple-300 text-sm">${card2.desc}</p>`;
            document.getElementById('future').innerHTML = `<img src="${card3.img}" class="card-img rounded-t-2xl" alt="${card3.name}"><p class="text-xl font-bold text-purple-200 mt-3">${card3.name}</p><p class="mt-2 text-purple-300 text-sm">${card3.desc}</p>`;

            const randomInterpretation = interpretations[Math.floor(Math.random() * interpretations.length)];

            document.getElementById('interpretation').innerHTML = randomInterpretation;
            document.getElementById('result').classList.remove('hidden');

            currentIndex = (currentIndex + 1) % tarotCards.length;
        }

        function flipCard(card) {
            card.classList.toggle('flipped');
        }

        window.onload = drawNewCards;
    </script>
</body>
</html>
