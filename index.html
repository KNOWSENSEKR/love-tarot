            }
            const selectedCards = cardIndices.slice(0, 3);

            const selectedIndividualMessages = [msgPast, msgPresent, msgFuture];

            interpDiv.innerHTML = '';
            interpDiv.style.display = 'block';

            const positions = ['[과거] 연애 흐름', '[현재] 상대방 속마음', '[미래] 관계 변화'];

            selectedCards.forEach((num, i) => {
                const name = cardNames[num - 1];
                const msg = selectedIndividualMessages[i];

                container.innerHTML += `
                    <div class="card" id="card${i}">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front">
                                <img src="${num}.png" alt="${name}" onerror="this.src='https://via.placeholder.com/150x225/1a0033/ffccff?text=${name}'">
                                <div class="card-name">${name}</div>
                            </div>
                        </div>
                    </div>`;
                setTimeout(() => document.getElementById(`card${i}`).classList.add('flipped'), 150 + i * 150);
            });

            let html = `<h2 style="font-size:1.3rem; color:#00FFCC; text-align:center; margin-bottom:15px;">🔮 카드 분석 결과</h2>`;
