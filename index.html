<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연애운 타로 | 3장 스프레드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .card {
            transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            height: 260px;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card-front {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .card-back {
            background: white;
            transform: rotateY(180deg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-2 text-purple-800">연애운 타로</h1>
        <p class="text-center text-purple-600 mb-10">3장으로 보는 당신의 연애 이야기</p>

        <div class="grid grid-cols-3 gap-6" id="cards">
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">과거</div>
                    <div class="card-back" id="past"></div>
                </div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">현재</div>
                    <div class="card-back" id="present"></div>
                </div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-inner">
                    <div class="card-front">미래</div>
                    <div class="card-back" id="future"></div>
                </div>
            </div>
        </div>

        <div class="text-center mt-12">
            <button onclick="drawNewCards()" 
                    class="px-12 py-5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl font-medium text-lg shadow-lg hover:shadow-xl transition-all">
                새로운 타로 뽑기
            </button>
        </div>

        <div id="result" class="mt-12 hidden">
            <div class="bg-white rounded-3xl p-9 shadow-xl">
                <h3 class="text-2xl font-bold text-center mb-8 text-purple-800">당신의 연애운 해석</h3>
                <div id="interpretation" class="text-gray-700 leading-relaxed text-[17.2px] space-y-6"></div>
            </div>
        </div>
    </div>

    <script>
        const tarotDeck = [
            { name: "연인", desc: "강렬한 끌림과 선택의 순간" },
            { name: "여황제", desc: "풍요롭고 따뜻한 사랑 에너지" },
            { name: "여사제", desc: "내면의 지혜와 직관" },
            { name: "마법사", desc: "능동적으로 사랑을 이끌어가는 힘" },
            { name: "태양", desc: "밝고 따뜻한 행복" },
            { name: "별", desc: "희망과 치유" },
            { name: "탑", desc: "갑작스러운 변화" },
            { name: "달", desc: "불안과 착각" },
            { name: "죽음", desc: "관계의 큰 전환" },
            { name: "절제", desc: "균형과 조화" },
            { name: "힘", desc: "용기와 열정" },
            { name: "전차", desc: "방향을 잡고 나아가는 시기" }
        ];

        // 30개의 다양한 해석 문구 (희망적 + 독립적 + 여성 시점 중심)
        const interpretations = [
            "과거의 경험은 당신을 더 강하게 만들었어요. 이제는 자신을 우선으로 하는 사랑을 만나게 될 거예요.",
            "현재 당신은 누군가에게 의지하기보다는 스스로를 사랑하는 법을 배우고 있어요. 이 과정이 매우 소중합니다.",
            "미래에는 건강하고 존중받는 관계가 기다리고 있어요. 당신의 행복은 당신 스스로가 선택하는 거예요.",
            "당신은 이미 충분히 빛나는 사람이에요. 진짜 사랑은 당신을 더 자유롭게 만들어줄 거예요.",
            "과거의 아픔이 지금의 당신을 더 현명하게 만들었어요. 이제는 자신을 아끼는 선택을 할 때입니다.",
            "현재는 자신을 돌아보는 시간이 필요해요. 당신의 마음을 먼저 채우면 좋은 인연이 자연스럽게 다가올 거예요.",
            "미래에는 균형 잡힌, 서로를 존중하는 사랑이 찾아올 가능성이 높아요. 기대해도 좋아요.",
            "당신은 혼자여도 충분히 행복할 수 있는 사람입니다. 그 마음이 진짜 사랑을 끌어당길 거예요.",
            "과거의 교훈을 잘 새기고 있다면, 이번에는 훨씬 더 건강한 관계를 만들 수 있을 거예요.",
            "현재 당신의 에너지는 매우 밝아요. 자신을 사랑하는 마음이 강해질수록 좋은 일이 생길 거예요.",
            "미래에는 당신을 진심으로 아껴주는 사람이 나타날 가능성이 커요. 서두르지 마세요.",
            "당신은 사랑받을 자격이 충분한 사람이에요. 자신을 소중히 여기면 좋은 인연이 따라올 거예요.",
            "과거의 경험은 당신을 성장시켰어요. 이제는 더 나은 선택을 할 수 있는 힘이 생겼습니다.",
            "현재는 혼자 있는 시간을 즐기는 게 중요해요. 그 시간이 당신을 더 매력적으로 만들어줄 거예요.",
            "미래에는 서로를 응원하고 성장시키는 따뜻한 관계가 기다리고 있어요.",
            "당신은 강하고 아름다운 사람이에요. 진짜 사랑은 당신의 가치를 알아보는 사람에게 올 거예요.",
            "과거의 상처를 잘 치유하고 있다면, 새로운 사랑이 더 건강하게 시작될 수 있어요.",
            "현재 당신의 마음이 안정되면, 좋은 사람이 자연스럽게 다가올 거예요.",
            "미래에는 당신이 주도적으로 행복을 선택하는 연애가 펼쳐질 가능성이 높아요.",
            "당신은 사랑을 받을 뿐만 아니라, 사랑을 줄 수 있는 멋진 사람이에요.",
            "과거의 교훈을 바탕으로, 이제는 자신을 더 사랑하는 관계를 만들 수 있을 거예요.",
            "현재는 자신을 먼저 돌보는 시간이에요. 그 마음이 좋은 인연을 끌어당깁니다.",
            "미래에는 서로의 꿈을 응원하는 따뜻하고 성숙한 사랑이 찾아올 거예요.",
            "당신은 혼자서도 충분히 행복할 수 있는 강한 사람이에요. 그 점을 잊지 마세요.",
            "과거의 경험은 당신을 더 아름답게 만들었어요. 이제는 그 아름다움을 만끽할 차례예요.",
            "현재 당신의 마음이 자유로워지면, 진짜 사랑이 다가올 가능성이 커집니다.",
            "미래에는 당신을 진심으로 존중하고 아껴주는 사람이 나타날 거예요.",
            "당신은 사랑받을 준비가 되어 있는 멋진 사람이에요. 자신을 믿으세요.",
            "과거의 아픔을 넘어선 당신은, 이제 더 밝은 사랑을 만날 자격이 충분해요.",
            "현재는 자신을 사랑하는 연습을 하는 시간입니다. 그 연습이 좋은 결과를 가져올 거예요."
        ];

        function drawNewCards() {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));

            const shuffled = [...tarotDeck].sort(() => Math.random() - 0.5);
            const past = shuffled[0];
            const present = shuffled[1];
            const future = shuffled[2];

            document.getElementById('past').innerHTML = `<p class="text-2xl font-bold text-purple-700">${past.name}</p><p class="mt-3 text-gray-600">${past.desc}</p>`;
            document.getElementById('present').innerHTML = `<p class="text-2xl font-bold text-purple-700">${present.name}</p><p class="mt-3 text-gray-600">${present.desc}</p>`;
            document.getElementById('future').innerHTML = `<p class="text-2xl font-bold text-purple-700">${future.name}</p><p class="mt-3 text-gray-600">${future.desc}</p>`;

            // 30개 해석 중 랜덤 선택
            const randomInterpretation = interpretations[Math.floor(Math.random() * interpretations.length)];

            document.getElementById('interpretation').innerHTML = randomInterpretation;
            document.getElementById('result').classList.remove('hidden');
        }

        function flipCard(card) {
            card.classList.toggle('flipped');
        }

        window.onload = drawNewCards;
    </script>
</body>
</html>
