<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음코드 러비타로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #1a0f2e, #2a1b4a, #3a1f4f);
        }
        .tarot-card {
            height: 380px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 22px;
        }
        .card-front {
            transform: rotateY(180deg);
        }
        .card-back {
            background: #0f172a url('https://knowsensekr.github.io/love-tarot/back.png') center/cover no-repeat;
        }
        /* 한글 라벨을 더 강하고 진하게 */
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.98), rgba(0,0,0,0.85), rgba(0,0,0,0.6));
            padding: 48px 18px 32px;
            color: #ffffff;
            text-align: center;
            z-index: 20;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .card-label p:first-child {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .card-label p:last-child {
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.95;
        }
    </style>
</head>
<body class="min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4 text-center">
        
        <div class="flex justify-center mb-8">
            <a href="https://www.youtube.com/@mindcode_k" target="_blank" 
               class="inline-flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-all px-7 py-3.5 rounded-full border border-white/20">
                <span class="text-red-500 text-3xl">▶️</span>
                <span class="text-white font-medium text-lg">마음코드 구독하기</span>
            </a>
        </div>

        <h1 class="text-5xl font-bold text-white mb-1">마음코드 러비타로</h1>
        <p class="text-purple-400 text-lg mb-2">v1.00</p>
        <p class="text-purple-300 mb-14">당신의 사랑 이야기를 카드가 말합니다</p>

        <div class="grid grid-cols-3 gap-6 mb-14" id="cards">
            <div id="card1" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front1"></div>
                </div>
            </div>
            <div id="card2" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front2"></div>
                </div>
            </div>
            <div id="card3" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front3"></div>
                </div>
            </div>
        </div>

        <button onclick="drawCards()" 
                class="px-20 py-7 text-xl font-medium rounded-3xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white shadow-2xl transition-all active:scale-95">
            새로운 타로 3장 펼치기
        </button>

        <div id="result" class="hidden mt-16 bg-white/10 backdrop-blur-2xl rounded-3xl p-12 text-left border border-white/10">
            <h3 class="text-2xl font-bold text-white mb-10 text-center">당신의 연애운 해석</h3>
            <div id="interpretation" class="text-purple-100 leading-relaxed text-[17.3px] space-y-8"></div>
        </div>
    </div>

    <script>
        const baseUrl = "https://knowsensekr.github.io/love-tarot/";

        const deck = [
            { num: 1,  name: "바보",       desc: "새로운 시작과 순수한 마음" },
            { num: 2,  name: "마법사",     desc: "능동적으로 사랑을 이끌어가는 힘" },
            { num: 3,  name: "여사제",     desc: "내면의 지혜와 직관" },
            { num: 4,  name: "여황제",     desc: "풍요롭고 따뜻한 사랑 에너지" },
            { num: 5,  name: "황제",       desc: "안정과 보호의 에너지" },
            { num: 6,  name: "교황",       desc: "전통과 조언" },
            { num: 7,  name: "연인",       desc: "강렬한 끌림과 선택의 순간" },
            { num: 8,  name: "전차",       desc: "방향을 잡고 나아가는 시기" },
            { num: 9,  name: "힘",         desc: "용기와 열정" },
            { num: 10, name: "은둔자",     desc: "자기 성찰과 내면 탐구" },
            { num: 11, name: "운명의 바퀴", desc: "인연의 변화와 타이밍" },
            { num: 12, name: "정의",       desc: "균형과 공정한 관계" },
            { num: 13, name: "매달린 사람", desc: "관점의 전환" },
            { num: 14, name: "죽음",       desc: "관계의 큰 전환" },
            { num: 15, name: "절제",       desc: "균형과 조화" },
            { num: 16, name: "악마",       desc: "집착과 중독의 관계" },
            { num: 17, name: "탑",         desc: "갑작스러운 변화" },
            { num: 18, name: "별",         desc: "희망과 치유" },
            { num: 19, name: "달",         desc: "불안과 착각" },
            { num: 20, name: "태양",       desc: "밝고 따뜻한 행복" },
            { num: 21, name: "심판",       desc: "재평가와 새로운 시작" },
            { num: 22, name: "세계",       desc: "완성된 사랑과 조화" }
        ];

        let currentIndex = 0;

        const finalMessages = [ /* 50개 메시지 배열은 이전과 동일합니다. 공간 절약을 위해 생략했으나 실제로는 이전 코드의 finalMessages 전체를 그대로 사용하세요 */ 
            "당신은 혼자여도 충분히 빛나는 사람입니다. 누군가의 사랑을 받지 않아도, 당신 자체로 이미 충분히 소중하고 아름다운 존재예요. 진짜 사랑은 당신을 더 자유롭고 당당하게 만들어줄 거예요. 자신을 먼저 사랑하는 마음이 모든 관계의 시작이 됩니다.",
            // ... (나머지 49개 메시지는 이전 버전에서 그대로 복사해서 넣어주세요)
            "당신은 이미 충분히 빛나고 있어요. 그 빛을 알아보는 사람이 곧 나타날 거예요."
        ];

        function drawCards() {
            document.getElementById('result').classList.add('hidden');

            const shuffled = [...deck].sort(() => Math.random() - 0.5);
            const c1 = shuffled[0];
            const c2 = shuffled[1];
            const c3 = shuffled[2];

            // 카드1
            document.getElementById('card1').innerHTML = `
                <div class="card-inner" style="transform: rotateY(0deg);">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <img src="${baseUrl}${c1.num}.png" class="w-full h-full object-cover" alt="${c1.name}">
                        <div class="card-label">
                            <p>${c1.name}</p>
                            <p>${c1.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            // 카드2
            document.getElementById('card2').innerHTML = `
                <div class="card-inner" style="transform: rotateY(0deg);">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <img src="${baseUrl}${c2.num}.png" class="w-full h-full object-cover" alt="${c2.name}">
                        <div class="card-label">
                            <p>${c2.name}</p>
                            <p>${c2.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            // 카드3
            document.getElementById('card3').innerHTML = `
                <div class="card-inner" style="transform: rotateY(0deg);">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <img src="${baseUrl}${c3.num}.png" class="w-full h-full object-cover" alt="${c3.name}">
                        <div class="card-label">
                            <p>${c3.name}</p>
                            <p>${c3.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            // 뒤집기 애니메이션
            setTimeout(() => {
                document.getElementById('card1').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
                document.getElementById('card2').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
                document.getElementById('card3').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
            }, 180);

            const message = finalMessages[currentIndex];
            currentIndex = (currentIndex + 1) % finalMessages.length;

            document.getElementById('interpretation').innerHTML = `
                <p><strong>과거:</strong> ${c1.desc}의 경험이 아직 당신의 마음에 영향을 주고 있습니다.</p>
                <p class="mt-7"><strong>현재:</strong> ${c2.desc}의 에너지가 강하게 느껴지는 시기예요. 자신을 먼저 사랑해주세요.</p>
                <p class="mt-7"><strong>미래:</strong> ${c3.desc}의 방향으로 흘러갈 가능성이 높습니다. 건강한 사랑을 기대해도 좋아요.</p>
                <p class="mt-12 pt-8 border-t border-purple-700/50 text-purple-200 text-center font-medium">${message}</p>
            `;

            document.getElementById('result').classList.remove('hidden');
        }

        window.onload = () => {};
    </script>
</body>
</html>
