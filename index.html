<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음코드 러비타로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #1a0f2e, #2a1b4a, #3a1f4f);
        }
        .tarot-card {
            height: 360px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            position: relative;
            cursor: pointer;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 22px;
        }
        .card-front {
            transform: rotateY(180deg);
        }
        .card-back {
            background: #0f172a url('https://knowsensekr.github.io/love-tarot/back.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: #6b21a8;
            opacity: 0.95;
        }
    </style>
</head>
<body class="min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4 text-center">
        
        <!-- 구독 버튼 -->
        <div class="flex justify-center mb-8">
            <a href="https://www.youtube.com/@mindcode_k" target="_blank" 
               class="inline-flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-all px-7 py-3.5 rounded-full border border-white/20">
                <span class="text-red-500 text-3xl">▶️</span>
                <span class="text-white font-medium text-lg">마음코드 구독하기</span>
            </a>
        </div>

        <h1 class="text-5xl font-bold text-white mb-1">마음코드 러비타로</h1>
        <p class="text-purple-400 text-lg mb-2">v1.00</p>
        <p class="text-purple-300 mb-14">당신의 사랑 이야기를 카드가 말합니다</p>

        <div class="grid grid-cols-3 gap-6 mb-14" id="cards">
            <div id="card1" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front1"></div>
                </div>
            </div>
            <div id="card2" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front2"></div>
                </div>
            </div>
            <div id="card3" class="tarot-card">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front" id="front3"></div>
                </div>
            </div>
        </div>

        <button onclick="drawCards()" 
                class="px-20 py-7 text-xl font-medium rounded-3xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white shadow-2xl transition-all active:scale-95">
            새로운 타로 3장 펼치기
        </button>

        <div id="result" class="hidden mt-16 bg-white/10 backdrop-blur-2xl rounded-3xl p-12 text-left border border-white/10">
            <h3 class="text-2xl font-bold text-white mb-10 text-center">당신의 연애운 해석</h3>
            <div id="interpretation" class="text-purple-100 leading-relaxed text-[17.3px] space-y-8"></div>
        </div>
    </div>

                    <div class="card-front absolute inset-0">
                        <img src="${baseUrl}${c1.num}.png" class="w-full h-full object-cover">
                        <div class="card-label">
                            <p class="font-bold text-2xl">${c1.name}</p>
                            <p class="text-sm">${c1.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('card2').innerHTML = `
                <div class="card-inner" style="transform: rotateY(0deg);">
                    <div class="card-back absolute inset-0"></div>
                    <div class="card-front absolute inset-0">
                        <img src="${baseUrl}${c2.num}.png" class="w-full h-full object-cover">
                        <div class="card-label">
                            <p class="font-bold text-2xl">${c2.name}</p>
                            <p class="text-sm">${c2.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('card3').innerHTML = `
                <div class="card-inner" style="transform: rotateY(0deg);">
                    <div class="card-back absolute inset-0"></div>
                    <div class="card-front absolute inset-0">
                        <img src="${baseUrl}${c3.num}.png" class="w-full h-full object-cover">
                        <div class="card-label">
                            <p class="font-bold text-2xl">${c3.name}</p>
                            <p class="text-sm">${c3.desc}</p>
                        </div>
                    </div>
                </div>
            `;

            // 약간의 딜레이 후 앞면으로 뒤집기
            setTimeout(() => {
                document.getElementById('card1').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
                document.getElementById('card2').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
                document.getElementById('card3').querySelector('.card-inner').style.transform = 'rotateY(180deg)';
            }, 150);

            const message = finalMessages[currentIndex];
            currentIndex = (currentIndex + 1) % finalMessages.length;

            document.getElementById('interpretation').innerHTML = `
                <p><strong>과거:</strong> ${c1.desc}의 경험이 아직 당신의 마음에 영향을 주고 있습니다.</p>
                <p class="mt-7"><strong>현재:</strong> ${c2.desc}의 에너지가 강하게 느껴지는 시기예요. 자신을 먼저 사랑해주세요.</p>
                <p class="mt-7"><strong>미래:</strong> ${c3.desc}의 방향으로 흘러갈 가능성이 높습니다. 건강한 사랑을 기대해도 좋아요.</p>
                <p class="mt-12 pt-8 border-t border-purple-700/50 text-purple-200 text-center font-medium">${message}</p>
            `;

            document.getElementById('result').classList.remove('hidden');
        }

        // 처음 로드 시 뒷면만 보이게
        window.onload = () => {};
    </script>
</body>
</html>
