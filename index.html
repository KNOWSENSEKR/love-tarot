<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음코드 연애심리 타로 v1.4 - 지브리 에디션</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            /* [핵심] 배경 이미지 외부 링크로 변경 */
            background-image: url('https://knowsensekr.github.io/love-tarot/bg.png'); /* 이미지 파일명 */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            min-height: 100vh; 
            word-break: keep-all;
        }

        /* 배경 위에 글자가 잘 보이도록 반투명 오버레이 추가 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 0, 26, 0.7); 
            z-index: -1;
        }

        /* 제목 및 브랜드 강조 */
        h1 { 
            font-size: 1.6rem; 
            color: #fff; 
            margin: 25px 0 15px; 
            text-shadow: 0 0 10px rgba(255,255,255,0.2); 
            position: relative; 
        }
        .brand-point { 
            color: #00FFCC; 
            text-shadow: 0 0 15px rgba(0,255,204,0.8);
            font-weight: 900;
        }

        /* 유튜브 스타일 구독 버튼 */
        .sub-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(to right, #FF0000, #CC0000); 
            color: white; 
            padding: 10px 22px; 
            font-size: 0.9rem; 
            font-weight: 700;
            border-radius: 6px; 
            text-decoration: none; 
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255,0,0,0.3); 
            transition: 0.3s;
            position: relative; 
        }
        .sub-btn::before {
            content: '▶'; 
            font-size: 0.7rem;
            margin-right: 8px;
            background: white;
            color: #FF0000;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .sub-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,0,0,0.5); }
        
        .description { font-size: 0.95rem; margin-bottom: 25px; color: #ffddff; opacity: 0.8; position: relative;}
        
        button#draw-btn { 
            background: linear-gradient(45deg, #ff3399, #ff66cc); 
            color: white; 
            border: none; 
            padding: 15px 35px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(255,51,153,0.5); 
            transition: 0.3s; 
            position: relative;
        }

        .cards { display: flex; justify-content: center; gap: 8px; margin: 30px 0; position: relative;}
        .card { width: 31%; max-width: 130px; aspect-ratio: 2/3; perspective: 1000px; }
