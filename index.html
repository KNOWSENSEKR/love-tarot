<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 마음코드 러비타로 v1.00</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #1a0033; color: #fff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffccff; }
        .cards { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .card { width: 180px; height: 250px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .card-back { background: url('back.png') center/cover; }
        .card-front { background: #fff; color: #000; transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: center; padding: 10px; }
        .card-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #8b00ff; }
        button { background: #ff66cc; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; margin: 20px 0; }
        button:hover { background: #ff99dd; }
        .interpretation { margin-top: 40px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .position { font-size: 20px; margin: 20px 0 10px; color: #ffccff; }
        .sub-btn { background: #ff3366; padding: 12px 25px; font-size: 16px; border-radius: 30px; text-decoration: none; color: white; display: inline-block; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🔮 마음코드 러비타로</h1>
    <a href="https://www.youtube.com/@mindcode_k" target="_blank" class="sub-btn">▶️ 마음코드 구독하기</a>
    <p style="font-size:18px; margin:20px 0;">당신의 사랑 이야기를 카드가 말합니다</p>
    
    <button onclick="drawCards()">새로운 타로 3장 펼치기</button>
    
    <div class="cards" id="cards">
        <!-- 카드 3장이 JS로 생성됨 -->
    </div>
    
    <div class="interpretation" id="interpretation"></div>

    <script>
        const cardNames = ["바보", "마법사", "여교황", "여황제", "황제", "교황", "연인", "전차", "힘", "은둔자", "운명의 수레바퀴", "정의", "매달린 사람", "죽음", "절제", "악마", "탑", "별", "달", "태양", "심판", "세계"];
        const loveMessages = [
            "상대방은 지금 당신을 그리워하고 있지만, 자존심 때문에 다가오지 못하고 있어요.",
            "희소성 원리를 활용해 거리를 두면 상대가 더 적극적으로 변할 수 있습니다.",
            // ... (총 50개 순환 메시지 – 필요하면 더 추가해 드릴게요)
            "현재는 연락을 멈추고 자신을 가꾸는 시간이 필요합니다."
        ];

        function getRandomCard() {
            return Math.floor(Math.random() * 22) + 1;
        }

        function drawCards() {
            const cardsContainer = document.getElementById('cards');
            const interp = document.getElementById('interpretation');
            cardsContainer.innerHTML = '';
            interp.innerHTML = '';

            const positions = ['과거', '현재', '미래'];
            
            for (let i = 0; i < 3; i++) {
                const cardNum = getRandomCard();
                const cardHTML = `
                    <div class="card" id="card${i}">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front">
                                <img src="${cardNum}.png" style="width:100%; height:180px; object-fit:contain;" alt="${cardNames[cardNum-1]}">
                                <div class="card-name">${cardNames[cardNum-1]}</div>
                                <p>연애운 해석 준비중...</p>
                            </div>
                        </div>
                    </div>
                `;
                cardsContainer.innerHTML += cardHTML;

                // 약간의 딜레이 후 뒤집기
                setTimeout(() => {
                    document.getElementById(`card${i}`).classList.add('flipped');
                }, 300 * i);
            }

            // 해석 영역
            let html = '<h2>당신의 연애운 해석</h2>';
            for (let i = 0; i < 3; i++) {
                const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                html += `
                    <div class="position">${positions[i]}</div>
                    <p>${msg}</p>
                `;
            }
            interp.innerHTML = html;
        }

        // 처음 로드 시 뒷면만 표시
        window.onload = function() {
            const cardsContainer = document.getElementById('cards');
            let html = '';
            for (let i = 0; i < 3; i++) {
                html += `
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front"></div>
                        </div>
                    </div>
                `;
            }
            cardsContainer.innerHTML = html;
        };
    </script>
</body>
</html>
