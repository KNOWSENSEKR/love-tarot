<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 마음코드 러비타로 v1.00</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #2a0044, #4a0077);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.8rem;
            color: #ffccff;
            margin: 20px 0 10px;
            text-shadow: 0 0 15px rgba(255, 100, 255, 0.6);
        }
        .sub-btn {
            display: inline-block;
            background: #ff3399;
            color: white;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 50px;
            text-decoration: none;
            margin: 15px 0 30px;
            box-shadow: 0 8px 20px rgba(255, 51, 153, 0.4);
        }
        .sub-btn:hover { background: #ff66bb; transform: scale(1.05); }

        .description {
            font-size: 1.3rem;
            margin: 20px 0 40px;
            color: #ffddff;
        }

        button {
            background: linear-gradient(45deg, #ff3399, #ff66cc);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 153, 0.5);
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 51, 153, 0.6);
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .card {
            width: 200px;
            height: 280px;
            perspective: 1200px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }
        .card-back {
            background: url('back.png') center/cover no-repeat;
        }
        .card-front {
            background: #fff;
            color: #000;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .card-front img {
            width: 95%;
            height: 170px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .card-name {
            font-size: 28px;
            font-weight: 900;
            color: #8b00ff;
            margin: 8px 0 6px;
            line-height: 1.2;
        }
        .card-desc {
            font-size: 15px;
            color: #555;
            line-height: 1.4;
        }

        .interpretation {
            max-width: 820px;
            margin: 60px auto 0;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 35px 25px;
        }
        .position {
            font-size: 1.5rem;
            color: #ffccff;
            margin: 25px 0 10px;
            font-weight: 700;
        }
        .message {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #ffeeee;
        }
    </style>
</head>
<body>
    <h1>🔮 마음코드 러비타로</h1>
    <a href="https://www.youtube.com/@mindcode_k" target="_blank" class="sub-btn">▶️ 마음코드 구독하기</a>
    <div class="description">당신의 사랑 이야기를 카드가 말합니다</div>

    <button onclick="drawCards()">새로운 타로 3장 펼치기</button>

    <div class="cards" id="cards"></div>

    <div class="interpretation" id="interpretation"></div>

    <script>
        const cardNames = ["바보","마법사","여교황","여황제","황제","교황","연인","전차","힘","은둔자","운명의 수레바퀴","정의","매달린 사람","죽음","절제","악마","탑","별","달","태양","심판","세계"];
        
        const loveMessages = [
            "상대방은 당신을 아직도 많이 생각하고 있지만, 자존심 때문에 먼저 다가오지 못하고 있어요.",
            "지금은 연락을 조금 멈추고 자신을 더 빛나게 가꾸는 시간이 필요합니다.",
            "희소성 원리를 활용하면 상대가 자연스럽게 당신에게 다시 끌리게 될 거예요.",
            "현재 관계는 작은 변화만으로도 충분히 회복될 수 있는 단계입니다.",
            "상대는 당신과의 추억을 자주 떠올리며 후회하고 있습니다.",
            // 실제로 50개까지 넣고 싶으시면 말씀해주세요. 지금은 예시 10개 정도만 넣었어요.
            "당신의 따뜻한 마음이 상대에게 다시 전달될 수 있도록 천천히 다가가 보세요."
        ];

        function getRandomCard() {
            return Math.floor(Math.random() * 22) + 1;
        }

        function drawCards() {
            const container = document.getElementById('cards');
            const interpDiv = document.getElementById('interpretation');
            container.innerHTML = '';
            interpDiv.innerHTML = '';

            const positions = ['과거', '현재', '미래'];

            for (let i = 0; i < 3; i++) {
                const num = getRandomCard();
                const name = cardNames[num - 1];
                const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];

                const cardHTML = `
                    <div class="card" id="card${i}">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front">
                                <img src="${num}.png" alt="${name}">
                                <div class="card-name">${name}</div>
                                <div class="card-desc">연애운 해석 준비중...</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;

                // 순차적으로 뒤집기
                setTimeout(() => {
                    document.getElementById(`card${i}`).classList.add('flipped');
                }, 200 + i * 180);
            }

            // 해석 표시
            let html = `<h2 style="color:#ffccff; margin-bottom:30px;">당신의 연애운 해석</h2>`;
            for (let i = 0; i < 3; i++) {
                const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
                html += `
                    <div class="position">${positions[i]}</div>
                    <div class="message">${msg}</div>
                `;
            }
            interpDiv.innerHTML = html;
        }

        // 페이지 로드 시 3장 뒷면으로 미리 표시
        window.onload = () => {
            const container = document.getElementById('cards');
            let html = '';
            for (let i = 0; i < 3; i++) {
                html += `
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-back"></div>
                            <div class="card-front"></div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        };
    </script>
</body>
</html>
