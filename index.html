<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음코드 연애심리 타로 v1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #2a0044, #4a0077);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.9rem;
            color: #ffccff;
            margin: 25px 0 8px;
            text-shadow: 0 0 20px rgba(255, 100, 255, 0.8);
        }
        .sub-btn {
            display: inline-block;
            background: #ff3399;
            color: white;
            padding: 14px 34px;
            font-size: 1.15rem;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px 0 25px;
            box-shadow: 0 8px 20px rgba(255, 51, 153, 0.4);
        }
        .sub-btn:hover { background: #ff66bb; transform: scale(1.05); }

        .description { font-size: 1.35rem; margin: 15px 0 40px; color: #ffddff; }

        button {
            background: linear-gradient(45deg, #ff3399, #ff66cc);
            color: white;
            border: none;
            padding: 16px 42px;
            font-size: 1.35rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 153, 0.5);
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 51, 153, 0.6); }

        .cards {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 45px 0;
            flex-wrap: wrap;
        }
        .card {
            width: 210px;
            height: 300px;
            perspective: 1300px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
            transform-style: preserve-3d;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            overflow: hidden;
        }
        .card-back { background: url('back.png') center/cover no-repeat; }
        .card-front {
            background: #1a0033;
            color: #fff;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15px;
        }
        .card-front img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 18px 18px 0 0;
        }
        .card-name {
            font-size: 32px;
            font-weight: 900;
            color: #ffccff;
            margin: 12px 0 6px;
            text-shadow: 0 2px 8px rgba(255, 100, 255, 0.6);
        }
        .card-desc { font-size: 15px; color: #ddd; padding: 0 15px; line-height: 1.4; }

        .interpretation {
            max-width: 820px;
            margin: 60px auto 0;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px 30px;
        }
        .position {
            font-size: 1.65rem;
            color: #ffccff;
            margin: 32px 0 12px;
            font-weight: 700;
        }
        .message {
            font-size: 1.22rem;
            line-height: 1.85;
            color: #ffeeee;
            padding: 0 10px;
        }
    </style>
</head>
